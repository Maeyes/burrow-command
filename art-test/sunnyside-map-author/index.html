<!doctype html><meta charset=utf-8><title>Sunnyside Tile Picker</title><style>*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:470px 1fr;background:#151917;color:#eee;font:13px system-ui}aside{padding:12px;overflow:auto;background:#202622}h2{margin:0 0 6px}.bar{position:sticky;top:0;background:#202622;padding-bottom:8px;z-index:2}.palette{display:grid;grid-template-columns:repeat(5,82px);gap:5px}.tile{width:82px;height:100px;background:#111814;border:1px solid #4e5b54;color:#bbb;padding:3px;cursor:pointer}.tile:hover{border-color:#a5d985}.tile.sel{outline:3px solid #a5e56d}.tile canvas{display:block;width:72px;height:72px;margin:auto;image-rendering:pixelated;background:#263128}.id{text-align:center;font:11px monospace}.stage{overflow:auto;display:flex}.stage canvas{margin:auto;background:#58ad50;image-rendering:pixelated;cursor:crosshair;border:1px solid #5f6b64}button{padding:7px;margin:2px}</style><aside><div class=bar><h2>Sunnyside Tile Picker</h2><div id=chosen>Selected: 193</div><button id=undo>Undo</button><button id=clear>Clear</button><p>เลือกจากช่องใหญ่ด้านล่าง → วาดบน Map<br>LMB วาด · RMB ลบ</p></div><div id=palette class=palette></div></aside><div class=stage><canvas id=map width=1280 height=768></canvas></div><script>const I=new Image();I.src='output_tileset.png';const P=document.querySelector('#palette'),M=document.querySelector('#map'),G=M.getContext('2d');G.imageSmoothingEnabled=false;let selected=193,placed=[],down=false,last='';const src=id=>({x:(id%64)*20+2,y:Math.floor(id/64)*20+2});function preview(id){const b=document.createElement('button');b.className='tile'+(id===selected?' sel':'');const c=document.createElement('canvas');c.width=c.height=72;const q=c.getContext('2d');q.imageSmoothingEnabled=false;const s=src(id);q.drawImage(I,s.x,s.y,16,16,4,4,64,64);const d=document.createElement('div');d.className='id';d.textContent='#'+id;b.append(c,d);b.onclick=()=>{selected=id;chosen.textContent='Selected: '+id;document.querySelector('.tile.sel')?.classList.remove('sel');b.classList.add('sel')};return b}function buildPalette(){const frag=document.createDocumentFragment();for(let id=0;id<4096;id++)frag.append(preview(id));P.append(frag)}function draw(){G.fillStyle='#58ad50';G.fillRect(0,0,M.width,M.height);for(const p of placed){const s=src(p.id);G.drawImage(I,s.x,s.y,16,16,p.x,p.y,32,32)}}function pt(e){const r=M.getBoundingClientRect();return{x:Math.floor(((e.clientX-r.left)*M.width/r.width)/32)*32,y:Math.floor(((e.clientY-r.top)*M.height/r.height)/32)*32}}function paint(e){const p=pt(e),k=p.x+','+p.y;if(k===last)return;last=k;if(e.buttons===2){for(let i=placed.length-1;i>=0;i--)if(placed[i].x===p.x&&placed[i].y===p.y){placed.splice(i,1);break}}else placed.push({id:selected,...p});draw()}M.onmousedown=e=>{down=true;last='';paint(e)};M.onmousemove=e=>{if(down)paint(e)};M.oncontextmenu=e=>e.preventDefault();window.onmouseup=()=>{down=false;last=''};undo.onclick=()=>{placed.pop();draw()};clear.onclick=()=>{placed=[];draw()};I.onload=()=>{buildPalette();draw()}</script>
