<!doctype html><html><head><meta charset="utf-8"><title>Bunny World Forest Roster</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1713;color:#e9f2ec;font:14px system-ui}header{padding:16px 20px;background:#17241e;position:sticky;top:0;z-index:3;border-bottom:1px solid #30483c}h1{font-size:20px;margin:0}.sub{opacity:.65;margin-top:4px}.grid{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.card{background:#17241e;border:1px solid #30483c;border-radius:10px;padding:12px}.stage{height:190px;display:grid;place-items:center;background:#203128;background-image:linear-gradient(45deg,#293d32 25%,transparent 25%),linear-gradient(-45deg,#293d32 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#293d32 75%),linear-gradient(-45deg,transparent 75%,#293d32 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}.stage img{image-rendering:pixelated;width:144px;height:144px;object-fit:contain}.boss .stage img{width:176px;height:176px}.name{font-weight:800;font-size:15px;margin-top:10px}.meta{opacity:.65;font-size:12px;margin-top:4px}.tabs{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}button{background:#253a30;color:#dce9e1;border:1px solid #3a5949;border-radius:6px;padding:5px 8px;cursor:pointer}button.active{background:#416c56}.badge{float:right;font-size:11px;padding:3px 6px;border-radius:999px;background:#604b26;color:#ffe7a9}</style></head><body><header><h1>BUNNY WORLD · FOREST MONSTER ROSTER</h1><div class="sub">12 normal monsters · 4 families × 3 variants · 2 bosses · PixelLab export audition</div></header><main class="grid" id="grid"></main><script>

function path(dir,anim,i){return root+dir+'/animations/'+anim+'/unknown/frame_'+String(i).padStart(3,'0')+'.png'}
const grid=document.querySelector('#grid'); roster.forEach((r,idx)=>{const [name,dir,anim,count,boss,extras=[]]=r;const c=document.createElement('section');c.className='card'+(boss?' boss':'');c.innerHTML=`<div class=stage><img></div><div class=name>${name}${boss?'<span class=badge>BOSS</span>':''}</div><div class=meta>${boss?'64×64':'24×24'} · ${count} exported frames · 1 direction</div><div class=tabs></div>`;grid.append(c);const img=c.querySelector('img'),tabs=c.querySelector('.tabs');let current=anim,n=count,f=0,timer;const modes=[['Walk',anim,count],...extras];function play(a,num,btn){current=a;n=num;f=0;img.src=path(dir,current,0);tabs.querySelectorAll('button').forEach(b=>b.classList.remove('active'));btn?.classList.add('active')}modes.forEach((m,j)=>{const b=document.createElement('button');b.textContent=m[0];tabs.append(b);b.onclick=()=>play(m[1],m[2],b);if(!j)play(m[1],m[2],b)});timer=setInterval(()=>{f=(f+1)%n;img.src=path(dir,current,f)},boss?125:115)});
