<!doctype html><html><head><meta charset="utf-8"><title>Bunny World · Top-down Combat POC</title><style>*{box-sizing:border-box}html,body{margin:0;background:#101915;color:#e9f1eb;font-family:system-ui}header{padding:10px 16px;background:#16231d;border-bottom:1px solid #34483e}h1{font-size:16px;margin:0}.sub{font-size:12px;opacity:.72;margin-top:2px}canvas{display:block;width:min(1280px,100vw);height:auto;margin:auto;background:#203629;image-rendering:pixelated}</style></head><body><header><h1>BUNNY WORLD · TOP-DOWN 4-DIRECTION COMBAT</h1><div class="sub">WASD / click ground to move · click monster to chase and attack · monsters aggro and attack back</div></header><canvas id="c" width="1280" height="720"></canvas><script type="module">
const c=document.querySelector('#c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;const R='/Sunnyside_World_Assets/';
const load=s=>new Promise((ok,no)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=s});
const A={tiles:await load(R+'Tileset/spr_tileset_sunnysideworld_16px.png'),forest:await load(R+'Tileset/spr_tileset_sunnysideworld_forest_32px.png'),example:await load('/art-test/topdown-sunnyside-poc/Sunnyside_World_ExampleScene.png'),tree1:await load(R+'Elements/Plants/spr_deco_tree_01_strip4.png'),tree2:await load(R+'Elements/Plants/spr_deco_tree_02_strip4.png'),red:await load(R+'Elements/Plants/spr_deco_mushroom_red_01_strip4.png'),blue:await load(R+'Elements/Plants/spr_deco_mushroom_blue_01_strip4.png'),fire:await load(R+'Elements/VFX/Fire/spr_deco_fire_01_strip4.png'),gobWalk:await load(R+'Characters/Goblin/PNG/spr_walk_strip8.png'),gobAtk:await load(R+'Characters/Goblin/PNG/spr_attack_strip10.png'),skWalk:await load(R+'Characters/Skeleton/PNG/skeleton_walk_strip8.png'),skAtk:await load(R+'Characters/Skeleton/PNG/skeleton_attack_strip7.png')};
const heroSheet=await load('/art-test/topdown-sunnyside-poc/hero-idle-test/Create_a_production-read-Idle.png');
const HERO_CELL=84,HERO_DIR={down:0,right:2,up:4,left:6};
const W=1280,H=720,T=48,keys=new Set();let t=0,last=performance.now(),floaters=[];
const p={x:640,y:510,hp:100,maxHp:100,speed:190,dir:'down',target:null,combat:null,attackCd:0,attackAnim:0,hurt:0};
const mons=[['gob',420,330],['sk',820,320],['gob',930,535],['sk',315,545]].map(([type,x,y],i)=>({id:i,type,x,y,hp:60,maxHp:60,speed:type==='gob'?75:62,dir:'down',attackCd:0,attackAnim:0,hurt:0,aggro:false}));
function strip(img,n,f,x,y,s=2,flip=false){const w=img.width/n,h=img.height;g.save();g.translate(Math.round(x),Math.round(y));if(flip)g.scale(-1,1);g.drawImage(img,(f%n)*w,0,w,h,Math.round(-w*s/2),Math.round(-h*s),Math.round(w*s),Math.round(h*s));g.restore()}
function tile(sx,sy,x,y){g.drawImage(A.tiles,sx*16,sy*16,16,16,x,y,T,T)}
function face(o,dx,dy){if(Math.abs(dx)>Math.abs(dy))o.dir=dx>=0?'right':'left';else if(Math.abs(dy)>.01)o.dir=dy>=0?'down':'up'}
function toward(o,q,step,stop=0){const dx=q.x-o.x,dy=q.y-o.y,d=Math.hypot(dx,dy);if(d<=stop)return true;face(o,dx,dy);const n=Math.min(step,d-stop);o.x+=dx/d*n;o.y+=dy/d*n;return d-n<=stop}
function floater(x,y,text,color){floaters.push({x,y,text,color,life:1})}
function drawMap(f){const S=48,cols=Math.ceil(W/S),rows=Math.ceil(H/S);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const v=(x*13+y*7)%5;g.drawImage(A.tiles,(1+v)*16,0,16,16,x*S,y*S,S,S)}const path=(x,y,w,h)=>{for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){const v=(xx*5+yy*3)%3;g.drawImage(A.tiles,(18+v)*16,16,16,16,xx*S,yy*S,S,S)}};path(0,7,27,3);path(11,0,3,15);path(4,3,8,2);path(14,10,9,2);g.fillStyle='rgba(31,139,196,.92)';g.fillRect(0,0,W,96);g.fillRect(0,624,W,96);for(let x=0;x<W;x+=S){g.drawImage(A.tiles,0,64,16,16,x,96,S,S);g.drawImage(A.tiles,16,64,16,16,x,576,S,S)}for(const [img,x,y,s] of [[A.tree1,90,245,3],[A.tree2,165,220,3],[A.tree1,1090,250,3.1],[A.tree2,1180,520,3],[A.tree1,230,565,3],[A.tree2,1000,560,3],[A.tree1,410,210,2.8],[A.tree2,865,210,2.8]])strip(img,4,f,x,y,s);for(const [x,y] of [[300,250],[360,535],[945,250],[1030,535],[485,520]])strip(A.red,4,f,x,y,2);for(const [x,y] of [[520,235],[790,535],[1110,420]])strip(A.blue,4,f,x,y,2);strip(A.fire,4,Math.floor(t*9),720,330,2.5)}
function heroSprite(){return{col:HERO_DIR[p.dir]??0,row:0}}
function update(dt){p.attackCd=Math.max(0,p.attackCd-dt);p.attackAnim=Math.max(0,p.attackAnim-dt);p.hurt=Math.max(0,p.hurt-dt);
 let dx=(keys.has('d')?1:0)-(keys.has('a')?1:0),dy=(keys.has('s')?1:0)-(keys.has('w')?1:0);
 if(dx||dy){p.target=null;p.combat=null;const l=Math.hypot(dx,dy);dx/=l;dy/=l;face(p,dx,dy);p.x+=dx*p.speed*dt;p.y+=dy*p.speed*dt}
 else if(p.combat&&p.combat.hp>0){const m=p.combat,d=Math.hypot(m.x-p.x,m.y-p.y);if(d>68)toward(p,m,p.speed*dt,60);else{face(p,m.x-p.x,m.y-p.y);if(p.attackCd<=0){p.attackCd=.72;p.attackAnim=.34;const committed=m;setTimeout(()=>{if(committed.hp<=0)return;committed.hp=Math.max(0,committed.hp-14);committed.hurt=.18;committed.aggro=true;floater(committed.x,committed.y-42,'14','#fff0a5')},145)}}}else if(p.target&&toward(p,p.target,p.speed*dt,2))p.target=null;
 for(const m of mons){if(m.hp<=0)continue;m.attackCd=Math.max(0,m.attackCd-dt);m.attackAnim=Math.max(0,m.attackAnim-dt);m.hurt=Math.max(0,m.hurt-dt);let d=Math.hypot(p.x-m.x,p.y-m.y);if(d<185)m.aggro=true;if(!m.aggro)continue;if(d>46){toward(m,p,m.speed*dt,43)}else{face(m,p.x-m.x,p.y-m.y);if(m.attackCd<=0){m.attackCd=1.05;m.attackAnim=.42;setTimeout(()=>{if(m.hp<=0||p.hp<=0)return;if(Math.hypot(p.x-m.x,p.y-m.y)<=65){p.hp=Math.max(0,p.hp-7);p.hurt=.2;floater(p.x,p.y-50,'-7','#ff938b')}},180)}}}
 if(p.hp<=0){p.hp=p.maxHp;p.x=640;p.y=510;p.combat=null;for(const m of mons)m.aggro=false}
 for(const f of floaters){f.life-=dt;f.y-=24*dt}floaters=floaters.filter(f=>f.life>0)
}
function drawHero(){const idle=heroSprite(),s=.82,d=HERO_CELL*s,attacking=p.attackAnim>0;let col=idle.col,row=0,flip=false;if(attacking){const elapsed=.34-p.attackAnim;col=Math.min(8,Math.floor((elapsed/.34)*9));if(p.dir==='down')row=1;else if(p.dir==='right')row=3;else if(p.dir==='up')row=4;else{row=3;flip=true}}g.save();if(p.hurt>0)g.globalAlpha=.55;g.fillStyle='rgba(0,0,0,.22)';g.beginPath();g.ellipse(p.x,p.y,18,6,0,0,Math.PI*2);g.fill();g.translate(Math.round(p.x),Math.round(p.y));if(flip)g.scale(-1,1);g.drawImage(heroSheet,col*HERO_CELL,row*HERO_CELL,HERO_CELL,HERO_CELL,Math.round(-d/2),Math.round(-d),Math.round(d),Math.round(d));g.restore()}
function drawMonster(m){const atk=m.type==='gob'?A.gobAtk:A.skAtk,walk=m.type==='gob'?A.gobWalk:A.skWalk,n=m.type==='gob'?10:7,img=m.attackAnim>0?atk:walk,frames=m.attackAnim>0?n:8,flip=m.dir==='left',s=m.type==='gob'?1.65:2;g.save();if(m.hurt>0)g.globalAlpha=.55;strip(img,frames,Math.floor(t*(m.attackAnim>0?14:8)),m.x,m.y,s,flip);g.restore();g.fillStyle='#172019';g.fillRect(m.x-22,m.y-50,44,5);g.fillStyle='#d45f55';g.fillRect(m.x-22,m.y-50,44*m.hp/m.maxHp,5)}
function draw(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;update(dt);g.fillStyle='#203629';g.fillRect(0,0,W,H);drawMap(Math.floor(t*5));const order=[...mons.filter(m=>m.hp>0).map(o=>({y:o.y,k:'m',o})),{y:p.y,k:'p',o:p}].sort((a,b)=>a.y-b.y);for(const e of order)e.k==='p'?drawHero():drawMonster(e.o);for(const f of floaters){g.globalAlpha=Math.max(0,f.life);g.fillStyle=f.color;g.font='bold 16px system-ui';g.textAlign='center';g.fillText(f.text,f.x,f.y)}g.globalAlpha=1;g.textAlign='left';g.fillStyle='rgba(8,14,11,.82)';g.fillRect(18,18,260,58);g.fillStyle='#e4eee7';g.font='13px system-ui';g.fillText('PLAYER HP',32,40);g.fillStyle='#25372d';g.fillRect(32,49,220,12);g.fillStyle='#76d884';g.fillRect(32,49,220*p.hp/p.maxHp,12);g.fillText(p.hp+' / '+p.maxHp,180,40);requestAnimationFrame(draw)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if('wasd'.includes(k))keys.add(k)});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;let hit=null,best=Infinity;for(const m of mons){if(m.hp<=0)continue;const feetD=Math.hypot(x-m.x,y-m.y);const bodyD=Math.hypot(x-m.x,y-(m.y-34));const d=Math.min(feetD,bodyD);if(d<58&&d<best){hit=m;best=d}}if(hit){p.combat=hit;p.target=null}else{p.combat=null;p.target={x,y}}});requestAnimationFrame(draw);
</script></body></html>
