<!doctype html><html><head><meta charset="utf-8"><title>Mine Walkable Paint POC</title><style>
html,body{margin:0;background:#08090d;color:#fff;font-family:system-ui}main{width:min(1500px,100vw);margin:auto}canvas{width:100%;height:auto;display:block;background:#000;touch-action:none}.hud{position:fixed;left:14px;top:14px;background:#080b10ee;border:1px solid #59606b;padding:12px 14px;border-radius:9px;font-weight:800;z-index:4}.hud small{display:block;color:#9ba8ba;margin:5px 0}.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}.tools button{border:1px solid #56657a;background:#151d29;color:#dfe8f5;border-radius:6px;padding:6px 9px;font-weight:800;cursor:pointer}.tools button.active{border-color:#54e487;color:#7dffa8;background:#12331f}.tools input{width:120px}.status{color:#7dffa8!important}
</style></head><body><main><canvas id="scene" width="1536" height="1024"></canvas></main><div class="hud">MINE WALKABLE PAINTER
