<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Burrow Command — Village Progression</title>
<style>
  :root{--ink:#fff4dc;--dim:#c9bfa6;--gold:#ffd45c;--panel:rgba(14,18,14,.86);--line:rgba(255,230,170,.22);--pink:#ff8fbf}
  html,body{margin:0;height:100%;background:#07090b;color:var(--ink);font:13px/1.35 system-ui,sans-serif;overflow:hidden;user-select:none}
  /* One unobtrusive scrollbar for every scrollable Burrow Command panel, modal and list. */
  *{scrollbar-width:thin;scrollbar-color:#647b59 #172119}
  *::-webkit-scrollbar{width:7px;height:7px}
  *::-webkit-scrollbar-track{background:#172119;border-radius:99px}
  *::-webkit-scrollbar-thumb{background:#647b59;border:1px solid #172119;border-radius:99px;min-height:28px}
  *::-webkit-scrollbar-thumb:hover{background:#92ad7b}
  *::-webkit-scrollbar-corner{background:#172119}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #scene{image-rendering:pixelated;background:#101510;max-width:100vw;max-height:100vh;aspect-ratio:16/9;width:100vw;height:auto;touch-action:none}
  #scene.tower-move{cursor:crosshair}
  #worldLabels{position:absolute;inset:0;pointer-events:none;z-index:12;overflow:hidden}
  .bc-world-label{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:5px;transform:translate(-50%,-100%);background:rgba(19,29,21,.94);border:1.5px solid #b3c48e;color:#fff4d1;border-radius:6px;box-shadow:0 2px 0 #0a140e,0 4px 10px #000b;padding:4px 8px;font:800 11px/1.2 system-ui,sans-serif;text-shadow:0 1px 1px #071009;white-space:nowrap;min-height:25px;max-width:160px;z-index:1}
  .bc-world-label:hover:not(:disabled),.bc-world-label:focus-visible{background:#3c5434;border-color:#ffe2a0;box-shadow:0 0 0 2px rgba(255,223,158,.4),0 4px 12px #0009;z-index:3}
  .bc-world-label[data-world='sell']{border-color:#e4be6a;background:#40371d}
  .bc-world-label[data-world-tower]{border-color:#94bcd2;background:#24383e}
  #towerMoveNotice{font-size:11px;line-height:1.4;padding:7px;border-radius:6px;border:1px solid #d2b263;background:#40331a;color:#ffe9ad}
  #towerMoveNotice[hidden]{display:none}
  /* Loading screen: painted art, with live progress laid over the bar painted into it. */
  .bc-night-summary{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:36;width:min(330px,calc(100vw - 24px));padding:10px 12px;border-radius:12px;background:rgba(27,36,25,.96);border:2px solid #b39558;box-shadow:0 8px 28px #000a;color:#f2ead0;animation:bc-summary-in .35s ease-out}
  .bc-night-summary[hidden]{display:none!important}
  .bc-night-summary[data-won="0"]{border-color:#d9776a}
  .bc-night-summary header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .bc-night-summary header strong{font-size:14px;color:#ffe08a}.bc-night-summary header button{min-width:34px;min-height:34px}
  .bc-night-summary ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
  .bc-night-summary li{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 6px;background:#233021;border-radius:6px}
  .bc-night-summary li b{color:#fff}.bc-night-summary p{margin:7px 0 0;font-size:11.5px;color:#ffd49e}
  @keyframes bc-summary-in{from{opacity:0;transform:translate(-50%,16px)}}
  @media (max-width:760px){.bc-night-summary{bottom:calc(72px + env(safe-area-inset-bottom,0px))}}
  @media (prefers-reduced-motion:reduce){.bc-night-summary{animation:none}}
  /* Next-goal hint hangs under the top HUD panel in every layout. */
  .bc-next-goal{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);width:max-content;max-width:min(560px,calc(100vw - 24px));padding:5px 12px;border-radius:0 0 10px 10px;font-size:12px;font-weight:700;line-height:1.3;white-space:normal;text-align:center;color:#fff3c9;background:rgba(38,32,18,.92);border:1px solid #b39558;box-shadow:0 3px 10px #0007;pointer-events:none}
  .bc-next-goal[data-tone="warn"]{color:#fff;background:rgba(122,52,20,.95);border-color:#ffb35c;animation:bc-goal-pulse 1s ease-in-out infinite alternate}
  .bc-next-goal[data-tone="night"]{color:#dfe6ff;background:rgba(24,28,58,.94);border-color:#7d8fe0}
  #tutorialCard.bc-tutorial{z-index:70}
  .bc-option-card{grid-column:1/-1}
  .bc-option-card .bc-option-have{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#d8c48a;margin:4px 0}
  .bc-option-lines{display:grid;gap:4px;margin:6px 0}
  .bc-option-line{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;background:rgba(120,80,200,.16);border:1px solid rgba(190,150,255,.35);font-size:12px}
  .bc-option-line b{color:#cfa8ff}.bc-option-line.empty{opacity:.55;border-style:dashed}
  .bc-option-line.locked{background:rgba(232,194,106,.18);border-color:#e8c26a}
  .bc-option-line button{min-height:26px;padding:2px 7px}
  .bc-option-line span small{opacity:.7;margin-left:2px}
  .bc-opt-plain{color:#e8e2d0}.bc-opt-blue{color:#7fc4ff}.bc-opt-purple{color:#d38cff}
  .bc-opt-gold{color:#ffd65c;text-shadow:0 0 6px rgba(255,214,92,.55)}
  .bc-option-line:has(.bc-opt-gold){border-color:#e8c26a}
  .bc-opt-legend{display:block;margin-top:4px}
  .bc-armory-layout{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
  .bc-class-rail{display:flex;flex-direction:column;flex-wrap:nowrap;gap:5px;margin:0;position:sticky;top:0}
  .bc-class-rail button{justify-content:flex-start;width:104px;min-height:38px;padding:4px 8px;font-size:12px}
  .bc-armory-col{display:flex;flex-direction:column;gap:10px;min-width:0}
  .bc-armory-main{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:stretch}
  .bc-armory-main>.bc-armory-slots{display:grid;grid-template-rows:repeat(3,1fr);grid-template-columns:none;gap:8px;margin:0}
  .bc-armory-main .bc-armory-slot{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;width:auto;min-height:0;padding:6px 4px}
  .bc-armory-main .bc-armory-slot .bc-gear-icon,.bc-armory-main .bc-armory-slot .bc-armory-empty-icon{width:50px;height:50px}
  .bc-slot-name{font-size:10.5px!important;color:#cbb37a!important}
  .bc-armory-main>.bc-armory-current{display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:left;min-height:0;padding:12px 14px}
  .bc-armory-main>.bc-armory-current>div{flex:none}
  .bc-current-head{display:flex!important;flex-direction:row!important;align-items:center;gap:12px}
  .bc-current-head>.bc-gear-icon,.bc-current-head>.bc-armory-empty-icon{width:58px;height:58px;flex-shrink:0}
  .bc-current-head>div{display:flex;flex-direction:column;gap:2px;min-width:0}
  .bc-current-head b{font-size:15px;color:#ffdf9d}.bc-current-head small{color:#bad1b6;font-size:11px}
  .bc-current-stats{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .bc-current-stats>div{background:rgba(0,0,0,.18);border-radius:7px;padding:5px 8px}
  .bc-current-stats small{display:block;color:#bfb48a;font-size:10.5px}.bc-current-stats b{font-size:15px;color:#fff3c9}
  .bc-current-options{display:grid!important;gap:5px}
  .bc-current-opt{display:grid;grid-template-columns:16px minmax(0,1fr) 70px;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;border:1px solid rgba(190,150,255,.28);font-size:12px}
  .bc-current-opt>small{color:#a99e7c}.bc-current-opt span small{opacity:.7;margin-left:2px}
  .bc-current-opt.empty{border-style:dashed;opacity:.55}
  .bc-opt-bar{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--bar) var(--pct),rgba(255,255,255,.1) var(--pct))}
  .bc-bar-gold{--bar:#ffd65c}.bc-bar-purple{--bar:#d38cff}.bc-bar-blue{--bar:#7fc4ff}.bc-bar-plain{--bar:#a9a38c}
  .bc-opt-none{margin:0;color:#a99e7c;font-size:11.5px}
  .bc-armory-col>.bc-armory-toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0}
  .bc-armory-col>.bc-armory-toolbar button.active{border-color:#e8c26a;background:#4a4128}
  @media (max-width:760px){.bc-armory-layout{grid-template-columns:minmax(0,1fr)}.bc-class-rail{flex-direction:row;overflow-x:auto;position:static}.bc-class-rail button{width:auto;flex:0 0 auto}.bc-current-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.bc-armory-col>.bc-armory-toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .bc-reveal-modal{width:min(640px,calc(100vw - 24px))!important;height:auto!important;max-height:90vh;z-index:60!important}
  .bc-reveal-body{display:flex;flex-direction:column;gap:12px}
  .bc-reveal-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .bc-reveal-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:9px;border:1px solid #5d6a45;background:rgba(0,0,0,.2);text-align:center;font-size:11px;
   opacity:0;transform:rotateY(90deg) scale(.85);animation:bc-reveal-in .32s ease-out var(--d) forwards}
  .bc-reveal-modal.skip .bc-reveal-card{animation-delay:0s;animation-duration:.01s}
  .bc-reveal-card .bc-gear-icon{width:52px;height:52px}
  .bc-reveal-card.rarity-epic{box-shadow:0 0 12px rgba(211,140,255,.45)}
  .bc-reveal-card.rarity-legend{box-shadow:0 0 14px rgba(255,214,92,.6);border-color:#e8c26a}
  .bc-reveal-card.rarity-mythic,.bc-reveal-card.rarity-whiteAscended{box-shadow:0 0 16px rgba(255,107,107,.65);border-color:#ff8b8b}
  .bc-reveal-card.dismantled{filter:grayscale(.85);opacity:.55}
  .bc-reveal-card.dismantled .bc-gear-icon{position:relative}
  .bc-reveal-tag{font-size:10px;padding:1px 6px;border-radius:5px}
  .bc-reveal-tag.kept{background:#2f5a35;color:#bff0c4}.bc-reveal-tag.review{background:#5a4a20;color:#ffe2a0}.bc-reveal-tag.gone{background:#5a2a2a;color:#ffb8b0}
  .bc-reveal-card small{color:#cbb37a;font-size:9.5px}
  .bc-reveal-summary{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .bc-reveal-note{margin:0;text-align:center;color:#cbb37a;font-size:12px}
  .bc-reveal-actions{display:flex;gap:8px;justify-content:center}
  @keyframes bc-reveal-in{to{opacity:1;transform:none}}
  .bc-reveal-card.dismantled{animation-name:bc-reveal-in-dim}
  @keyframes bc-reveal-in-dim{to{opacity:.55;transform:none}}
  @media (max-width:760px){.bc-reveal-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (prefers-reduced-motion:reduce){.bc-reveal-card{animation-duration:.01s;animation-delay:0s}}
  .bc-option-actions{display:flex;gap:6px;flex-wrap:wrap}.bc-option-actions button{flex:1 1 140px}
  .bc-tutorial{left:50%;bottom:14px;transform:translateX(-50%);width:min(340px,calc(100vw - 24px));padding:12px 14px;z-index:70;color:#fff3c9;background:rgba(38,32,18,.96);border:2px solid #e8c26a;box-shadow:0 6px 22px #000a;font-size:13px;line-height:1.45}
  .bc-tutorial p{margin:6px 0 8px}
  .bc-tut-behind{color:#ffd76a;font-weight:700}
  .bc-tut-head{display:flex;justify-content:space-between;gap:8px;font-size:14px}.bc-tut-head small{color:#cbb37a}
  .bc-tut-dots{display:flex;gap:5px;margin-bottom:8px}.bc-tut-dots i{width:8px;height:8px;border-radius:50%;background:#5a4c2c}.bc-tut-dots i.done{background:#b39558}.bc-tut-dots i.on{background:#ffd76a;box-shadow:0 0 6px #ffd76a}
  .bc-tut-actions{display:flex;justify-content:space-between;gap:8px}.bc-tut-actions button{min-height:32px;padding:5px 12px}.bc-tut-actions button.ghost{opacity:.7}
  .bc-tut-actions [data-tut="close"]{background:transparent;border-color:transparent;color:#cbb37a;text-decoration:underline}
  .bc-tut-target{outline:3px solid #ffd76a!important;outline-offset:2px;border-radius:8px;animation:bc-tut-pulse .9s ease-in-out infinite alternate;position:relative;z-index:44}
  #top .res.bc-tut-target,#clock.bc-tut-target,#top .bc-tut-target{position:static}
  @keyframes bc-tut-pulse{from{box-shadow:0 0 0 0 #ffd76a00}to{box-shadow:0 0 16px 4px #ffd76acc}}
  .bc-tutorial{transition:left .25s ease,top .25s ease}
  .bc-tutorial[data-side]:not([data-side=""])::after{content:'';position:absolute;width:0;height:0;border:10px solid transparent}
  .bc-tutorial[data-side="left"]::after{left:100%;top:var(--arrow-y);margin-top:-10px;border-left-color:#e8c26a}
  .bc-tutorial[data-side="right"]::after{right:100%;top:var(--arrow-y);margin-top:-10px;border-right-color:#e8c26a}
  .bc-tutorial[data-side="top"]::after{top:100%;left:var(--arrow-x);margin-left:-10px;border-top-color:#e8c26a}
  .bc-tutorial[data-side="bottom"]::after{bottom:100%;left:var(--arrow-x);margin-left:-10px;border-bottom-color:#e8c26a}
  @media (max-width:760px){.bc-tutorial{bottom:84px;font-size:12px;padding:10px 12px;width:min(320px,calc(100vw - 16px))}}
  @media (prefers-reduced-motion:reduce){.bc-tut-target{animation:none}}
  @keyframes bc-goal-pulse{to{box-shadow:0 0 14px #ff9b4a}}
  @media (max-width:760px){.bc-next-goal{font-size:10.5px;padding:4px 8px}}
  @media (prefers-reduced-motion:reduce){.bc-next-goal{animation:none}}
  .bc-loading{position:fixed;inset:0;z-index:90;overflow:hidden;background:#1b1410;transition:opacity .45s ease}
  .bc-loading::before{content:'';position:absolute;inset:-30px;background:url(/burrow-command/assets/loading-bg-CR-gaqSo.jpg) center/cover;filter:blur(18px) brightness(.55)}
  .bc-loading.done{opacity:0;pointer-events:none}
  .bc-loading-stage{position:absolute;left:50%;top:50%;width:max(100vw,min(calc(100vh * 1672 / 941),260vw));aspect-ratio:1672/941;transform:translate(-50%,-50%);background:url(/burrow-command/assets/loading-bg-CR-gaqSo.jpg) center/100% 100% no-repeat}
  .bc-loading-track{position:absolute;left:32.42%;top:86.08%;width:35.47%;height:4.89%;border-radius:999px}
  .bc-loading-rest{position:absolute;top:0;right:0;bottom:0;left:var(--p,0%);background:rgba(8,12,28,.62);border-radius:0 999px 999px 0;transition:left .35s ease}
  .bc-loading-runner{position:absolute;bottom:62%;left:var(--p,0%);width:calc(var(--h) * .66);height:var(--h);--h:min(15vh,8.5vw,22vw);transform:translateX(-62%);background:url(/burrow-command/assets/bunny-run-0c7s85qV.png) 0 0/600% 100% no-repeat;animation:bc-run .6s steps(6) infinite;transition:left .35s ease;filter:drop-shadow(0 4px 3px #0008)}
  @keyframes bc-run{to{background-position:120% 0}}
  #loading{position:absolute;left:0;right:0;top:calc(100% + 6px);text-align:center;font:700 clamp(11px,1.1vw,15px) system-ui,sans-serif;color:#fff4d6;text-shadow:0 2px 3px #000,0 0 8px #000}
  @media (prefers-reduced-motion:reduce){.bc-loading-runner{animation:none}}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);z-index:20}
  #top{left:50%;top:10px;transform:translateX(-50%);display:flex;gap:16px;align-items:center;padding:8px 14px;white-space:nowrap}
  #top b{font-size:15px}
  #clock{width:160px}#clock div{height:6px;background:#2a2f28;border-radius:3px;overflow:hidden;margin-top:4px}
  #clockbar{height:100%;background:linear-gradient(90deg,#ffe08a,#ff9a4a);transition:width .2s}#clockbar.night{background:linear-gradient(90deg,#6c7bd6,#b08cff)}
  #timer{color:var(--dim);font-size:12px}
  .res{display:flex;gap:10px}.res span{display:flex;gap:4px;align-items:center}.res b{color:var(--gold)}
  #hall{width:170px}#hall div{height:8px;background:#2a2f28;border-radius:4px;overflow:hidden;margin-top:3px}#burrow{height:100%;background:linear-gradient(90deg,#5fd07a,#a8f08a);transition:width .2s}
  #hall small{color:var(--dim)}
  #shopbox{left:10px;bottom:10px;padding:10px;width:min(330px,calc(100vw - 20px))}
  #shopbox h3,#side h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;color:var(--dim);font-weight:600}
  #shop{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .card{display:flex;flex-direction:column;gap:3px}
  button{font:inherit;color:var(--ink);background:#243024;border:1px solid #4d5d45;border-radius:7px;cursor:pointer;padding:6px}
  button:hover:not(:disabled){background:#2f4130;border-color:#8fb07a}
  button:disabled{opacity:.42;cursor:default}
  .buy{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:6px;text-align:left;align-items:center}
  .buy i{grid-row:1/3;font-style:normal;font-size:20px}.buy small{color:var(--dim);font-size:10px}.buy em{grid-column:1/3;font-style:normal;color:var(--gold);font-weight:700;text-align:right;margin-top:2px}
  .up{font-size:10px;padding:4px;background:#2b2618;border-color:#6a5a33}
  #forgeOpen{background:#59441c;border-color:#aa8845;color:#ffecbc}
  #side{right:10px;bottom:10px;padding:10px;width:min(280px,calc(100vw - 20px));display:flex;flex-direction:column;gap:6px;max-height:58vh}
  #squad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;width:100%;box-sizing:border-box;min-height:0;max-height:82px;overflow-y:auto;overflow-x:hidden;align-content:start;padding-right:3px}
  #upgrade:not(:disabled){background:#3b3212;border-color:#ffd45c;color:#ffe9a8}
  #wave{color:var(--gold);font-size:11px}
  #reset{margin-top:6px;font-size:10px;padding:3px 6px;background:#2a1a1a;border-color:#6a3a3a}
  #build.on{background:#5a4418;border-color:#ffd45c}
  #squad .bc-mini-hero{display:flex;align-items:center;gap:6px;min-width:0;width:100%;box-sizing:border-box;padding:4px 6px;text-align:left;white-space:nowrap}
  #squad .bc-mini-hero img{width:24px;height:24px;flex-shrink:0;image-rendering:pixelated}
  #squad .bc-mini-hero span{min-width:0;flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis}
  #squad .bc-mini-hero small{display:block;font-size:9px;color:var(--dim)}
  #squad .squad-card.down{border-color:#a04848;background:#3a1f1f}
  #squad .squad-card>button{width:52px;height:44px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
  #squad .squad-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
  #squad .squad-info small{font-size:10px;color:var(--dim)}#squad .squad-info select{width:100%;font-size:11px;background:#253025;color:var(--ink);border:1px solid #4d5d45}
  #squad .rename{padding:0 3px;font-size:12px;background:transparent;border:0}
  #squad small{font-size:9px}#squad .guard{border-color:#6c9bd6;background:#1f2a3a}#squad .down{border-color:#a04848;background:#3a1f1f}
  .row{display:flex;gap:6px}.row button{flex:1}
  #help{left:10px;top:10px;padding:6px;display:flex;gap:6px;max-width:none;font-size:11px;color:var(--dim);z-index:29}
  #help button{min-height:34px;padding:6px 9px;white-space:nowrap}
  #mythicTestControls{left:10px;top:58px;padding:7px;display:flex;gap:6px;align-items:center;z-index:29;border-color:#8b7040;background:#172019ed}
  #mythicTestControls select{min-height:34px;max-width:190px;padding:5px 8px;border:1px solid #6f6847;border-radius:7px;background:#243024;color:var(--ink);font:700 11px system-ui}
  #mythicTestSummon{min-height:34px;padding:6px 10px;background:#651b13;border-color:#bd7c4d;color:#ffe7ad;font-weight:800;white-space:nowrap}
  #banner{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;z-index:30}
  #banner b{display:block;font:800 44px Georgia,serif;color:#fff1c8;text-shadow:0 3px 0 #3a2616,0 0 30px rgba(255,180,90,.6)}#banner span{color:var(--ink);text-shadow:0 2px 4px #000}
