<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Shard Lab</title>
<style>body{margin:0;background:#10141f;color:#eee;font:16px system-ui}header{position:absolute;z-index:2;padding:18px;background:#111a}h1{font-size:20px;margin:0 0 10px}button,select{padding:10px;background:#27324b;color:white;border:1px solid #7985a3;border-radius:6px}p{font-size:13px;max-width:520px}canvas{width:100vw;height:100vh;display:block;image-rendering:pixelated}</style>
<header><h1>สะเก็ดพลัง Pixel</h1><select id="mode" aria-label="รูปแบบการเคลื่อนไหว"><option value="burst">สะเก็ดม่วงพุ่งกระจาย</option><option value="orbit">สะเก็ดม่วงหมุนวน</option><option value="source">ดูชิ้นส่วนประกอบเดิม</option><option value="wave">Excalibur คลื่นทองข้ามฉาก</option><option value="portal">วังวนม่วง</option><option value="summon">วงอัญเชิญทอง</option></select> <button id="replay">เล่นใหม่</button><p>ชิ้นที่แยกจากพื้นเขียวจริง • ขอบพิกเซล • ชิ้นที่ติดกันยังเป็นชิ้นเดียว ไม่มีการวาดส่วนที่ถูกบังเพิ่ม</p></header><canvas id="view"></canvas>
<script type="module">
const data=await(await fetch('./shards.json')).json(),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),mode=document.querySelector('select');
const load=src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src});
const pieces=await Promise.all(data.map(async(d,i)=>({...d,image:await load(d.file),angle:i*2.399,spin:((i%7)-3)*.7})));
const base='../dimraeth-slice/assets/mythic/king-arthur/';const wave=await load(base+'excalibur-golden-wave.png'),portal=await load(base+'excalibur-vortex.png'),summon=await load(base+'excalibur-summon.png');
let start=performance.now();document.querySelector('button').onclick=()=>start=performance.now();mode.onchange=()=>start=performance.now();
function frame(now){const w=canvas.width=innerWidth,h=canvas.height=innerHeight;ctx.imageSmoothingEnabled=false;ctx.fillStyle='#10141f';ctx.fillRect(0,0,w,h);const t=((now-start)/1000)%3.2,s=Math.min(w,h)*.5/1254,cx=w/2,cy=h*.57;ctx.strokeStyle='#283047';ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(w,cy);ctx.stroke();
 if(mode.value==='wave'){const k=Math.min(1,t/1.9),size=Math.min(h*.65,480);ctx.globalAlpha=Math.min(1,t*6,(1-k)*8);ctx.translate(-size/2+k*(w+size),cy);ctx.scale(-1,1);ctx.drawImage(wave,-size/2,-size/2,size,size);}
 else if(mode.value==='portal'||mode.value==='summon'){const im=mode.value==='portal'?portal:summon,size=Math.min(h*.7,600);ctx.globalAlpha=.75+Math.sin(t*6)*.2;ctx.drawImage(im,cx-size/2,cy-size/2,size,size);}
 else for(const p of pieces){ctx.save();let x,y,a=0,alpha=1;if(mode.value==='source'){x=cx+(p.x-627)*s;y=cy+(p.y-627)*s;}else if(mode.value==='orbit'){const r=70+(p.pixels<5000?140:50)+(p.angle%2)*35;x=cx+Math.cos(p.angle+t*1.4)*r;y=cy+Math.sin(p.angle+t*1.4)*r*.55;a=t*p.spin;alpha=.85;}else{const k=Math.min(1,t/2.3),r=20+k*(150+(p.angle%3)*70);x=cx+Math.cos(p.angle)*r;y=cy+Math.sin(p.angle)*r*.6-65*k+100*k*k;a=t*p.spin;alpha=Math.min(1,t*8,(1-k)*3);}ctx.translate(Math.round(x),Math.round(y));ctx.rotate(a);ctx.globalAlpha=alpha;const scale=p.pixels>5000?s*.55:s;ctx.drawImage(p.image,-p.w*scale/2,-p.h*scale/2,p.w*scale,p.h*scale);ctx.restore();}
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
