<!doctype html><meta charset=utf-8><title>Sunnyside Autotile Lab</title><style>body{margin:0;background:#15251a;color:#fff;font:14px system-ui}canvas{display:block;margin:40px auto;image-rendering:pixelated;border:1px solid #557}p{text-align:center}</style><p>STEP 1 — GameMaker autotile 16-state lab: Land / Path / River / Forest</p><canvas id=c width=1280 height=720></canvas><script>const c=document.querySelector('#c'),g=c.getContext('2d'),A=new Image(),F=new Image();A.src='../gamemaker-room-import/tiles.png';F.src='../gamemaker-room-import/forest.png';Promise.all([A.decode(),F.decode()]).then(draw);const sets={Land:[193,194,195,196,197,198,199,200,257,258,259,260,261,262,263,264],Path:[449,450,451,452,453,454,455,456,513,514,515,516,517,518,519,0],River:[470,471,472,473,474,475,476,477,534,535,536,537,538,539,540,0],Forest:[11,12,13,14,15,16,17,18,21,22,23,24,25,26,27,0]};function tile(im,id,cols,q,x,y,s){if(!id)return;g.drawImage(im,id%cols*q,Math.floor(id/cols)*q,q,q,x,y,q*s,q*s)}function draw(){g.fillStyle='#294c31';g.fillRect(0,0,c.width,c.height);let names=Object.keys(sets);for(let r=0;r<4;r++){let name=names[r],arr=sets[name],forest=name==='Forest',im=forest?F:A,q=forest?32:16,cols=forest?10:64,s=forest?2:4,y=55+r*165;g.fillStyle='#fff';g.font='700 18px system-ui';g.fillText(name,35,y+35);for(let i=0;i<16;i++){let x=150+i*68;tile(im,arr[i],cols,q,x,y,s);g.fillStyle='#d8eadb';g.font='11px monospace';g.fillText(i+': '+arr[i],x,y+75)}}}</script>
