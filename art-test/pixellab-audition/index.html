<!doctype html><html><head><meta charset="utf-8"><title>PixelLab Audition</title><style>*{box-sizing:border-box}body{margin:0;background:#101815;color:#e5eee8;font:14px system-ui}header{padding:14px 18px;background:#17231f;position:sticky;top:0;z-index:2}h1{font-size:18px;margin:0}.sub{opacity:.65;margin-top:4px}.hero{display:flex;gap:20px;align-items:center;padding:20px;border-bottom:1px solid #30453c}.stage{width:220px;height:180px;display:grid;place-items:center;background:#1c2b25;background-image:linear-gradient(45deg,#263a31 25%,transparent 25%),linear-gradient(-45deg,#263a31 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#263a31 75%),linear-gradient(-45deg,transparent 75%,#263a31 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}.stage img{image-rendering:pixelated;width:144px;height:144px;object-fit:contain}.grid{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.card{background:#17231f;border:1px solid #30453c;padding:9px}.tree{height:120px;display:grid;place-items:end center;background:#20382c}.tree img{width:96px;height:96px;object-fit:contain;image-rendering:pixelated}.meta{font-size:12px;opacity:.65;margin-top:6px}</style></head><body><header><h1>PIXELLAB · BUNNY WORLD AUDITION</h1><div class=sub>Mossblob 8-frame walk + 13 isometric tree candidates</div></header><section class=hero><div class=stage><img id=moss></div><div><h2>Mossblob · Walk</h2><p>96×96 per generated frame · 8 frames · low top-down</p><p>Animated directly from the exported PixelLab frames.</p></div></section><main class=grid id=grid></main><script>
const base='/art-test/monster-generation/pixellab-2026-09-21/objects/';
const mossDir=base+'ORIGINAL_small_round_hostile_w/animations/Walk/unknown/';
const frames=Array.from({length:8},(_,i)=>mossDir+'frame_'+String(i).padStart(3,'0')+'.png');let f=0;const im=document.querySelector('#moss');im.src=frames[0];setInterval(()=>im.src=frames[f=(f+1)%8],110);
const names=['isometric_pixel_cute_tree',...Array.from({length:12},(_,i)=>'isometric_pixel_cute_tree_'+(i+2))];
const grid=document.querySelector('#grid');names.forEach((n,i)=>{const e=document.createElement('div');e.className='card';e.innerHTML='<div class=tree><img src="'+base+n+'/rotations/'+n+'.png"></div><b>Tree '+(i+1)+'</b><div class=meta>48×48 · low top-down</div>';grid.append(e)});
</script></body></html>
